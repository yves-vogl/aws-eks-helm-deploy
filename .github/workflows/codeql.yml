# CodeQL static analysis — covers Python source under src/.
# Findings appear in the Security tab → Code scanning alerts.
# Weekly schedule catches new CodeQL queries; on-push catches regressions.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC — separate hour from scorecard.yml to avoid collision.
    - cron: '0 7 * * 1'

# Top-level permissions are read-only per OpenSSF Scorecard best practice
# (least-privilege GITHUB_TOKEN); write scopes are hoisted to job level below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # security-events:write so CodeQL can upload SARIF to Code Scanning.
      security-events: write
      # actions:read so CodeQL can resolve workflow refs when analysing actions.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          # default + security-extended for stricter coverage; matches Scorecard
          # expectation that SAST runs on every PR.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:python"
